name: FoxyVPN Android APK Build

on:
  workflow_dispatch:
  push:
    paths:
      - '**.zip'
      - '.github/workflows/foxy-merged-android.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare preinstalled Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -name sdkmanager -perm -111 2>/dev/null | sort -V | tail -n 1)"
          fi
          if [ -z "${SDKMANAGER:-}" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "No executable sdkmanager found in preinstalled Android SDK." >&2
            ls -la "$ANDROID_SDK_ROOT/cmdline-tools" || true
            exit 1
          fi
          echo "Using SDK manager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/build-tools/36.0.0" >> "$GITHUB_PATH"

      - name: Extract project ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="$(find . -maxdepth 2 -type f -iname '*.zip' | head -n 1)"
          if [ -z "$ZIP_FILE" ]; then
            echo "No project ZIP found in repository root." >&2
            exit 1
          fi
          mkdir -p extracted
          unzip -q "$ZIP_FILE" -d extracted
          echo "Extracted project archive: $ZIP_FILE"
          find extracted -maxdepth 5 \( -name gradlew -o -name settings.gradle -o -name settings.gradle.kts \) -print

      - name: Locate Android Gradle project
        id: project
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$(find "$GITHUB_WORKSPACE/extracted" -type f \( -name settings.gradle -o -name settings.gradle.kts \) -printf '%h\n' | head -n 1)"
          if [ -z "$ROOT" ]; then
            echo "Could not find settings.gradle or settings.gradle.kts in extracted ZIP." >&2
            exit 1
          fi
          echo "root=$ROOT" >> "$GITHUB_OUTPUT"
          echo "Project root: $ROOT"

      - name: Fix vpnLib Android library variant
        working-directory: ${{ steps.project.outputs.root }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -d vpnLib ]; then
            BUILD_FILE=""
            for f in vpnLib/build.gradle vpnLib/build.gradle.kts; do
              if [ -f "$f" ]; then BUILD_FILE="$f"; break; fi
            done
            if [ -z "$BUILD_FILE" ] || ! grep -Eq 'com\.android\.library|android-library' "$BUILD_FILE"; then
              echo "vpnLib does not declare an Android library plugin; replacing with the expected upstream vpnLib module."
              rm -rf vpnLib
              git clone --depth 1 --branch main https://github.com/hoang-rio/vpnLib.git vpnLib
            else
              echo "vpnLib already declares an Android library plugin."
            fi
          else
            echo "vpnLib directory missing; cloning expected upstream module."
            git clone --depth 1 --branch main https://github.com/hoang-rio/vpnLib.git vpnLib
          fi
          test -f vpnLib/build.gradle -o -f vpnLib/build.gradle.kts
          sed -n '1,100p' vpnLib/build.gradle 2>/dev/null || sed -n '1,100p' vpnLib/build.gradle.kts

      - name: Ensure Kotlin plugin is applied to vpnLib
        working-directory: ${{ steps.project.outputs.root }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -f vpnLib/build.gradle ]; then
            if ! grep -Eq "^plugins[[:space:]]*\\{|^apply plugin: ['\\\"]org\\.jetbrains\\.kotlin\\.android['\\\"]" vpnLib/build.gradle; then
              python3 - <<'PY'
from pathlib import Path
p = Path("vpnLib/build.gradle")
s = p.read_text()
block = "plugins { id 'org.jetbrains.kotlin.android' version '2.0.21' }\\n\\n"
if not s.lstrip().startswith('plugins {'):
    p.write_text(block + s)
PY
            fi
          elif [ -f vpnLib/build.gradle.kts ]; then
            if ! grep -q "org.jetbrains.kotlin.android" vpnLib/build.gradle.kts; then
              sed -i '1i plugins { id("org.jetbrains.kotlin.android") version "2.0.21" }\\n' vpnLib/build.gradle.kts
            fi
          else
            echo "vpnLib Gradle build file is missing." >&2
            exit 1
          fi
          echo "vpnLib Kotlin plugin configuration:"
          sed -n '1,45p' vpnLib/build.gradle 2>/dev/null || sed -n '1,45p' vpnLib/build.gradle.kts

      - name: Build debug APK
        working-directory: ${{ steps.project.outputs.root }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew --no-daemon :app:assembleDebug --stacktrace
          else
            gradle --no-daemon :app:assembleDebug --stacktrace
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FoxyVPN-Panther-debug-apk
          path: |
            ${{ steps.project.outputs.root }}/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
