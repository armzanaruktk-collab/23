name: FoxyVPN Android APK Build

on:
  workflow_dispatch:
  push:
    paths:
      - '**.zip'
      - '.github/workflows/foxy-merged-android.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Extract project ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="$(find . -maxdepth 2 -type f -iname '*.zip' | head -n 1)"
          if [ -z "$ZIP_FILE" ]; then
            echo "No project ZIP found in repository root." >&2
            exit 1
          fi
          mkdir -p extracted
          unzip -q "$ZIP_FILE" -d extracted
          echo "Extracted project archive: $ZIP_FILE"
          find extracted -maxdepth 4 \( -name gradlew -o -name settings.gradle -o -name settings.gradle.kts \) -print

      - name: Locate Android Gradle project
        id: project
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$(find "$GITHUB_WORKSPACE/extracted" -type f \( -name settings.gradle -o -name settings.gradle.kts \) -printf '%h\n' | head -n 1)"
          if [ -z "$ROOT" ]; then
            echo "Could not find settings.gradle or settings.gradle.kts in extracted ZIP." >&2
            exit 1
          fi
          echo "root=$ROOT" >> "$GITHUB_OUTPUT"
          echo "Project root: $ROOT"

      - name: Restore vpnLib Android library module if missing from ZIP
        working-directory: ${{ steps.project.outputs.root }}
        shell: bash
        run: |
          set -euo pipefail
          if grep -q "vpnLib" settings.gradle settings.gradle.kts 2>/dev/null; then
            if [ ! -f vpnLib/build.gradle ] && [ ! -f vpnLib/build.gradle.kts ]; then
              echo "vpnLib Gradle module is missing from the ZIP; restoring its configured Git submodule."
              rm -rf vpnLib
              git clone --depth 1 --branch main https://github.com/hoang-rio/vpnLib.git vpnLib
            fi
          fi

      - name: Build debug APK
        working-directory: ${{ steps.project.outputs.root }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew --no-daemon assembleDebug
          else
            gradle --no-daemon assembleDebug
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FoxyVPN-Panther-debug-apk
          path: |
            ${{ steps.project.outputs.root }}/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
